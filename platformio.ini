; CARDCORE - MeshCore companion firmware for M5Stack Cardputer ADV + Cap LoRa-1262
; Flash: pio run -t upload   (or flash cardcore.bin at 0x0 with ESPConnect / esptool)
;
; Built the way MeshCore builds itself: its src/ and lib/ (git submodule, untouched) plus
; its companion_radio example; our src/ supplies the board target and the keyboard UI.
[platformio]
default_envs = cardcore
src_dir = MeshCore/src
lib_dir = MeshCore/lib

[env:cardcore]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = post:merge_bin.py  ; writes cardcore.bin (flash at 0x0), stamps the version
build_src_filter =
  +<*.cpp>
  +<helpers/*.cpp>
  +<helpers/radiolib/*.cpp>
  +<helpers/sensors/*.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../../src/>
lib_deps =
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6  ; same pin as MeshCore
  rweather/Crypto@0.4.0
  adafruit/RTClib@2.1.4
  melopero/Melopero RV3028@1.2.0
  electroniccats/CayenneLPP@1.6.1
  densaugeo/base64@1.4.0
  stevemarple/MicroNMEA@2.0.6
  m5stack/M5Unified@0.2.11
  m5stack/M5Cardputer@1.1.1
  ; Grove-port environment sensors (MeshCore's sensor_base list): telemetry for free
  adafruit/Adafruit INA3221 Library@1.0.1
  adafruit/Adafruit INA219@1.2.3
  robtillaart/INA226@0.6.4
  adafruit/Adafruit INA260 Library@1.5.3
  adafruit/Adafruit AHTX0@2.0.5
  adafruit/Adafruit BME280 Library@2.3.0
  adafruit/Adafruit BMP280 Library@2.6.8
  adafruit/Adafruit SHTC3 Library@1.0.1
  sensirion/Sensirion I2C SHT4x@1.1.2
  arduino-libraries/Arduino_LPS22HB@1.0.2
  adafruit/Adafruit MLX90614 Library@2.1.5
  adafruit/Adafruit_VL53L0X@1.2.4
  adafruit/Adafruit BME680 Library@2.0.4
  adafruit/Adafruit BMP085 Library@1.2.4
build_flags =
  -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1 -D RADIOLIB_EXCLUDE_RF69=1 -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1 -D RADIOLIB_EXCLUDE_RFM2X=1 -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1 -D RADIOLIB_EXCLUDE_AX25=1 -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1 -D RADIOLIB_EXCLUDE_APRS=1 -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1 -D RADIOLIB_EXCLUDE_SSTV=1
  -D ESP32_PLATFORM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I src
  -I MeshCore/examples/companion_radio
  ; MeshCore Catalunya: 869.618 MHz, BW 62.5, SF7, CR6, 22 dBm (first-boot defaults)
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=6
  -D LORA_TX_POWER=22
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  ; Cap LoRa-1262 (SX1262); SPI shared with the microSD (CS 12)
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_NSS=5
  -D P_LORA_DIO_1=4
  -D P_LORA_RESET=3
  -D P_LORA_BUSY=6
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=39
  -D P_LORA_MOSI=14
  -D PIN_SD_CS=12
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=3.0f  ; as M5's examples; MeshCore retries at 0 V if it fails
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; MeshCore's Wire goes on the Grove port: M5Unified owns the internal bus (G8/G9)
  -D PIN_BOARD_SDA=2
  -D PIN_BOARD_SCL=1
  ; Cap GNSS (named from the GPS side, as MeshCore does: TX = module TX = MCU RX)
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_TX=15
  -D PIN_GPS_RX=13
  -D GPS_BAUD_RATE=115200
  -D ENV_INCLUDE_AHTX0=1 -D ENV_INCLUDE_BME280=1 -D ENV_INCLUDE_BMP280=1 -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1 -D ENV_INCLUDE_LPS22HB=1 -D ENV_INCLUDE_INA3221=1 -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1 -D ENV_INCLUDE_INA260=1 -D ENV_INCLUDE_MLX90614=1 -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1 -D ENV_INCLUDE_BMP085=1
  ; companion: keyboard UI + phone app over BLE and USB at the same time
  -D DISPLAY_CLASS=CardputerDisplay
  -D BLE_PIN_CODE=123456
  -D ENABLE_USB_INTERFACE
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=24
  -D OFFLINE_QUEUE_SIZE=32
