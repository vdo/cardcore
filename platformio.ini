[env:cardputer-adv]
platform = espressif32@6.11.0  ; same as MeshCore
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; MeshCore library
  -DESP32_PLATFORM
  -DRADIOLIB_STATIC_ONLY=1
  -DRADIOLIB_GODMODE=1
  -DMAX_CONTACTS=64
  -DMAX_GROUP_CHANNELS=8
  ; MeshCore EU/UK default radio, change at runtime with /radio
  -DLORA_FREQ=869.618
  -DLORA_BW=62.5
  -DLORA_SF=8
  -DLORA_CR=5
  -DLORA_TX_POWER=22
  ; Cap LoRa-1262 on Cardputer ADV
  -DP_LORA_NSS=5
  -DP_LORA_DIO_1=4
  -DP_LORA_RESET=3
  -DP_LORA_BUSY=6
  -DP_LORA_SCLK=40
  -DP_LORA_MISO=39
  -DP_LORA_MOSI=14
  -DSX126X_DIO3_TCXO_VOLTAGE=3.0
  -DSX126X_USE_REGULATOR_LDO=true
  -DSX126X_DIO2_AS_RF_SWITCH=true
  -DSX126X_CURRENT_LIMIT=140
  -DSX126X_RX_BOOSTED_GAIN=1
lib_deps =
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6  ; same as MeshCore
  https://github.com/meshcore-dev/MeshCore.git#81dbae592ffad40b4212bc0b37e82b38da08f4bc
  m5stack/M5Unified@^0.2.26
  m5stack/M5Cardputer@1.1.1  ; exact: newer git renames keysState().del
  mikalhart/TinyGPSPlus@^1.1.0
  sh123/esp32_codec2@^1.0.7
  densaugeo/base64@~1.4.0  ; MeshCore uses it without declaring it
lib_ldf_mode = deep+
extra_scripts = pre:meshcore.py
