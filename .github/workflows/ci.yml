name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install clang-format==18.1.8
      - run: clang-format --dry-run --Werror src/*.cpp include/*.h sim/*.cpp sim/*.h
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      # aggregates are always brace-initialized; default member initializers would break that under gnu++11
      - run: >
          cppcheck --language=c++ --std=c++17 --enable=warning,performance,portability
          --suppress=uninitMemberVarNoCtor --inline-suppr --error-exitcode=1 -q
          -DMAX_CONTACTS=64 -DMAX_GROUP_CHANNELS=8 -Iinclude src

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0
      - run: pio run
      - name: end-to-end test against real MeshCore (also renders docs/*.png)
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev && sh sim/run.sh
      - name: merge into one image flashable at 0x0
        run: |
          B=.pio/build/cardputer-adv
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32s3 merge_bin -o cardcore-${GITHUB_REF_NAME//\//-}.bin \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: cardcore-*.bin

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
      - run: gh release create "$GITHUB_REF_NAME" cardcore-*.bin --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
